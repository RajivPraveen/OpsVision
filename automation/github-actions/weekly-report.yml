name: Weekly report

on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build the sample database
        run: python -m opsvision seed
      - name: Generate weekly report
        run: python -m opsvision report
      - name: Upload executive report
        uses: actions/upload-artifact@v4
        with:
          name: opsvision-executive-report
          path: reports/executive-report-*
          retention-days: 30

